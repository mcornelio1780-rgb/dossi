<style>
:root{
  --sello:#2B3BD6;--sello-d:#1F2BA6;--tinta:#161A2E;--papel:#F3F4EF;--res:#FFE14D;--verde:#0E7352;--aviso:#C42F3E;--carbon:#5E6375;--linea:#D9DBE3;
  --bg:var(--papel);--fg:var(--tinta);--muted:var(--carbon);--card:#fff;--rule:var(--linea);--soft:#E7E9F7;--okbg:#E3F2EC;--errbg:#FBE7E9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131F;--fg:#ECEDF2;--muted:#A6ABBD;--card:#181C2C;--rule:#2A2F45;--soft:#1B2040;--okbg:#12322a;--errbg:#3a1820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131F;--fg:#ECEDF2;--muted:#A6ABBD;--card:#181C2C;--rule:#2A2F45;--soft:#1B2040;--okbg:#12322a;--errbg:#3a1820;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
:focus-visible{outline:3px solid var(--sello);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(34px,5vw,54px);font-weight:800}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;margin-bottom:8px}
p{margin:0 0 12px;max-width:64ch}
.muted{color:var(--muted)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--rule)}
.bar{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.bar .logo{width:100px;color:var(--fg);flex:none}
.prog{display:flex;gap:6px;margin-left:auto;align-items:center}
.prog i{width:28px;height:6px;border-radius:9px;background:var(--rule)}
.prog i.on{background:var(--sello)}
select.lang{width:auto;flex:none;font:600 15px var(--body);min-height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--fg);padding:0 8px}
main{max-width:1080px;margin:0 auto;padding:30px 18px 120px}
.step{display:none}.step.on{display:block}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:clamp(18px,3vw,28px);margin:18px 0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:16px var(--body);padding:10px 12px;min-height:48px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);color:var(--fg);width:100%}
input:focus,select:focus{outline:none;border-color:var(--sello);box-shadow:0 0 0 3px color-mix(in srgb,var(--sello) 25%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--body);min-height:50px;padding:0 20px;border-radius:12px;border:2px solid var(--sello);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.p{background:var(--sello);color:#fff}.btn.p:hover{background:var(--sello-d)}
.btn.s{background:transparent;color:var(--sello)}
.btn.h{background:var(--res);border-color:var(--res);color:var(--tinta)}
.btn.g{background:transparent;border-color:var(--rule);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:root[data-theme="dark"] .btn.s{color:#AEB6FF;border-color:#AEB6FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.s{color:#AEB6FF;border-color:#AEB6FF}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:30}
.nav .in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}
.drop{border:2.5px dashed var(--sello);border-radius:16px;padding:34px 18px;text-align:center;background:var(--soft);cursor:pointer;transition:background .15s}
.drop.over{background:color-mix(in srgb,var(--res) 40%,var(--soft))}
.drop b{font:800 22px var(--display);display:block;margin-bottom:6px}
.files{list-style:none;padding:0;margin:14px 0 0}
.files li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.files .ref{font:600 13px var(--mono);background:var(--soft);color:var(--sello);padding:2px 8px;border-radius:6px;flex:none}
.files .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--verde)}.pill.err{background:var(--errbg);color:var(--aviso)}.pill.run{background:var(--soft);color:var(--sello)}
.tblw{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
th{background:var(--soft);font-size:13px;white-space:nowrap}
td input,td select{min-height:40px;padding:6px 8px;font-size:15px}
td.num,th.num{text-align:right;font-family:var(--mono)}
td input.amt{text-align:right;font-family:var(--mono);width:110px}
tr.off{opacity:.45}
tr.warn td{background:color-mix(in srgb,var(--res) 18%,transparent)}
.x{background:none;border:none;color:var(--aviso);font-size:20px;cursor:pointer;min-width:40px;min-height:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px}
.kpi .v{font:800 34px/1.1 var(--display);letter-spacing:-.02em}
.kpi.hl{background:var(--sello);color:#fff;border-color:var(--sello)}
.notice{border-left:4px solid var(--sello);background:var(--soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px}
.notice.w{border-color:#B58900;background:color-mix(in srgb,var(--res) 25%,var(--card))}
canvas{width:100%;height:260px;display:block}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.hero .sym{width:min(260px,60%);justify-self:center;color:var(--sello);--ring:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.toast.on{opacity:1}
.check li{margin:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .sym{display:none}.prog{display:none}.bar .logo{width:86px}select.lang{margin-left:auto}}
</style>
</head>

/* ---------- parsing ---------- */
const MONTHS={jan:1,january:1,ene:1,enero:1,janv:1,janvier:1,janeiro:1,feb:2,february:2,febrero:2,fev:2,fevereiro:2,fevr:2,fevrier:2,mar:3,march:3,marzo:3,marco:3,mars:3,apr:4,april:4,abr:4,abril:4,avr:4,avril:4,may:5,mayo:5,mai:5,maio:5,jun:6,june:6,junio:6,juin:6,junho:6,jul:7,july:7,julio:7,juil:7,juillet:7,julho:7,aug:8,august:8,ago:8,agosto:8,aout:8,sep:9,sept:9,september:9,septiembre:9,setembro:9,set:9,septembre:9,oct:10,october:10,octubre:10,out:10,outubro:10,octobre:10,nov:11,november:11,noviembre:11,novembro:11,novembre:11,dec:12,december:12,dic:12,diciembre:12,dez:12,dezembro:12,decembre:12};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function guessYear(m){const p=S.profile;if(p.from&&p.to){for(const ym of monthsBetween(p.from,p.to)){if(+ym.slice(5)===m)return +ym.slice(0,4)}return +p.to.slice(0,4)}return new Date().getFullYear()}
function findDate(line){const s=norm(line);let m;
  if(m=s.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/))return iso(+m[1],+m[2],+m[3]);
  if(m=s.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2}|\d{2})\b/)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;if(a>12)return iso(y,b,a);return iso(y,a,b)}
  if(m=s.match(/\b([a-z]{3,10})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d{2}))?/)){const mo=MONTHS[m[1]]||MONTHS[m[1].slice(0,3)];if(mo){const y=m[3]?+m[3]:guessYear(mo);return iso(y,mo,+m[2])}}
  if(m=s.match(/\b(\d{1,2})\s+(?:de\s+)?([a-z]{3,10})\.?(?:\s+(?:de\s+)?(20\d{2}))?/)){const mo=MONTHS[m[2]]||MONTHS[m[2].slice(0,3)];if(mo){const y=m[3]?+m[3]:guessYear(mo);return iso(y,mo,+m[1])}}
  if(m=s.match(/\b(\d{1,2})\/(\d{1,2})\b/)){const a=+m[1],b=+m[2];if(a<=12&&b<=31)return iso(guessYear(a),a,b)}
  return null}
function iso(y,m,d){if(m<1||m>12||d<1||d>31)return null;return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function findAmounts(line){const out=[];const re=/([-+−])?\s?\$?\s?(\d{1,3}(?:[,.\s]\d{3})*(?:[.,]\d{2})|\d+[.,]\d{2})(?!\d)/g;let m;
  while(m=re.exec(line)){let raw=m[2].replace(/\s/g,'');let v;
    if(/,\d{2}$/.test(raw)&&!/\.\d{2}$/.test(raw))v=parseFloat(raw.replace(/\./g,'').replace(',','.'));else v=parseFloat(raw.replace(/,/g,''));
    if(!isNaN(v)&&v>0&&v<100000)out.push({v,neg:!!m[1]&&m[1]!=='+',hasDollar:/\$/.test(m[0])})}
  return out}
function detectSource(text){const s=norm(text);for(const [k,v] of SOURCES)if(s.includes(k))return v;
  if(/invoice|factura|fatura|facture/.test(s))return 'Invoice';if(/1099/.test(s))return 'Form 1099';if(/statement|extracto|extrato|releve|deposit|balance/.test(s))return 'Bank';return ''}
const TOTAL_KW=/(total|earnings|ganancias|ganhos|gains|you earned|ganaste|net pay|payout|pago|deposit|deposito|transfer|weekly|semana|tips|propinas|gorjeta|pourboire|subtotal)/i;
const DEBIT_KW=/(debit|purchase|withdraw|retiro|compra|pos |atm|fee|comision|taxa|frais|payment to|pago a|transfer to)/i;
function parseText(text,doc,fileDate){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);const docSrc=detectSource(text);const rows=[];
  let lastDate=null;const isBank=/statement|extracto|extrato|releve|account|cuenta|conta|compte/i.test(text)&&!/weekly|semanal/i.test(text);
  for(const ln of lines){const d=findDate(ln);if(d)lastDate=d;const am=findAmounts(ln);if(!am.length)continue;
    const lsrc=detectSource(ln);const n=norm(ln);
    if(isBank){ if(DEBIT_KW.test(n))continue; const a=am.find(x=>!x.neg);if(!a)continue;
      if(!lsrc&&!/deposit|deposito|credit|credito|transfer from|ach|direct dep|zelle|payout/.test(n))continue;
      rows.push(mk(d||lastDate,lsrc||docSrc,ln,a.v,doc));}
    else{ if(!(TOTAL_KW.test(n)||am.some(x=>x.hasDollar)))continue; const a=am.filter(x=>!x.neg).sort((p,q)=>q.v-p.v)[0];if(!a)continue;
      rows.push(mk(d||lastDate,lsrc||docSrc,ln,a.v,doc,TOTAL_KW.test(n)?2:1));}}
  // screenshots: prefer the "total" line if there is one to avoid double counting
  if(!isBank&&rows.length>1){const tot=rows.filter(r=>r._w===2&&/total|earnings|ganancias|ganhos|gains|payout/i.test(norm(r.desc)));if(tot.length){const best=tot.sort((a,b)=>b.amount-a.amount)[0];return [best].map(r=>fix(r,fileDate))}}
  return rows.map(r=>fix(r,fileDate))}
function mk(date,source,desc,amount,doc,w=1){return{id:rid++,use:true,date:date||'',source:source||'',desc:desc.slice(0,80),type:'inc',amount:Math.round(amount*100)/100,doc,_w:w}}
function fix(r,fileDate){if(!r.date&&fileDate)r.date=fileDate;delete r._w;return r}

const drop=$('#drop'),fin=$('#fileIn');
drop.onclick=()=>fin.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fin.click()}};
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));

function addFiles(list){[...list].forEach(f=>{if(!/^image\/|pdf$/.test(f.type))return;const d={id:did++,ref:'A'+(S.docs.length+1),name:f.name,type:f.type,file:f,status:'wait',n:0,images:[]};S.docs.push(d)});renderFiles();processQueue()}
function renderFiles(){$('#fileList').innerHTML=S.docs.map(d=>{const st=d.status==='ok'?`<span class="pill ok">✓ ${t('st_ok').replace('{n}',d.n)}</span>`:d.status==='none'?`<span class="pill err">${t('st_none')}</span>`:d.status==='err'?`<span class="pill err">${t('st_err')}</span>`:d.status==='read'?`<span class="pill run">${t('st_read')} ${d.pct?d.pct+'%':''}</span>`:`<span class="pill run">${t('st_wait')}</span>`;
  return `<li><span class="ref">${d.ref}</span><span class="nm">${esc(d.name)}</span>${st}<button class="x" aria-label="✕" data-del="${d.id}">✕</button></li>`}).join('');
  $$('[data-del]').forEach(b=>b.onclick=()=>{const id=+b.dataset.del;const d=S.docs.find(x=>x.id===id);S.docs=S.docs.filter(x=>x.id!==id);if(d)S.rows=S.rows.filter(r=>r.doc!==d.ref);renderFiles()})}
let busy=false,worker=null;
async function getWorker(){if(worker)return worker;if(!window.Tesseract)throw new Error('libs');worker=await Tesseract.createWorker(CONFIG.ocrLangs,1,{logger:m=>{const d=S.docs.find(x=>x.status==='read');if(d&&m.status==='recognizing text'){d.pct=Math.round(m.progress*100);renderFiles()}}});return worker}
async function processQueue(){if(busy)return;busy=true;
  for(const d of S.docs.filter(x=>x.status==='wait')){d.status='read';renderFiles();
    try{const fileDate=new Date(d.file.lastModified).toISOString().slice(0,10);let text='';
      if(d.type==='application/pdf'){if(!window.pdfjsLib)throw new Error('libs');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf=await pdfjsLib.getDocument({data:await d.file.arrayBuffer()}).promise;
        for(let i=1;i<=Math.min(pdf.numPages,20);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
          // rebuild lines by y position
          const byY={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]);(byY[y]=byY[y]||[]).push(it)});
          text+=Object.keys(byY).sort((a,b)=>b-a).map(y=>byY[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')).join('\n')+'\n';
          const vp=pg.getViewport({scale:1.4});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;d.images.push({url:c.toDataURL('image/jpeg',.78),w:c.width,h:c.height});
          if(text.trim().length<20&&i===1){const w=await getWorker();const r=await w.recognize(c);text+=r.data.text}}}
      else{const url=await fileToDataURL(d.file);const img=await loadImg(url);const c=document.createElement('canvas');const sc=Math.min(1,1800/Math.max(img.width,img.height));c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);d.images.push({url:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height});
        const w=await getWorker();const r=await w.recognize(c);text=r.data.text}
      const rows=parseText(text,d.ref,fileDate);d.n=rows.length;d.text=text;
      if(rows.length){S.rows.push(...rows);d.status='ok'}else{S.rows.push(mk(fileDate,detectSource(text),d.name,0,d.ref));d.status='none'}
    }catch(e){console.error(e);d.status='err';if(e.message==='libs')toast(t('libs'));S.rows.push(mk('', '', d.name,0,d.ref))}
    renderFiles()}
  busy=false}
const fileToDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
$('#cAdd').onclick=()=>{const m=$('#cMonth').value,a=parseFloat($('#cAmt').value);if(!m||!(a>0)){toast(t('need_rows'));return}
  S.rows.push({id:rid++,use:true,date:m+'-28',source:t('t_cash'),desc:$('#cDesc').value||t('t_cash'),type:'cash',amount:a,doc:'C'});$('#cAmt').value='';$('#cDesc').value='';toast(t('added'))};

/* ---------- review ---------- */
function flags(){const months=new Set(monthsBetween(S.profile.from,S.profile.to));const seen={};const out=new Set();
  S.rows.forEach(r=>{if(!r.use)return;if(r.date&&months.size&&!months.has(r.date.slice(0,7)))out.add(r.id);if(!r.date)out.add(r.id);
    const k=r.date+'|'+r.amount+'|'+norm(r.source);if(r.amount>0&&seen[k])out.add(r.id),out.add(seen[k]);seen[k]=r.id});return out}
function renderRows(){const f=flags();
  $('#rows').innerHTML=S.rows.map(r=>`<tr class="${r.use?'':'off'} ${f.has(r.id)?'warn':''}" data-id="${r.id}">

  const n=f.size;$('#rNotice').hidden=!n;$('#rNotice').textContent=t('r_warn').replace('{n}',n);

$('#addRow').onclick=()=>{S.rows.push({id:rid++,use:true,date:(S.profile.to||'')+'-01',source:'',desc:'',type:'inc',amount:0,doc:''});renderRows()};

/* ---------- summary ---------- */
function compute(){const months=monthsBetween(S.profile.from,S.profile.to);const act=S.rows.filter(r=>r.use&&r.amount>0&&r.date&&months.includes(r.date.slice(0,7)));
  const srcs=[...new Set(act.filter(r=>r.type!=='exp').map(r=>r.type==='cash'?'Cash':(r.source||'Other')))];
  const table=months.map(m=>{const row={m,by:{},inc:0,exp:0};act.filter(r=>r.date.slice(0,7)===m).forEach(r=>{if(r.type==='exp')row.exp+=r.amount;else{const s=r.type==='cash'?'Cash':(r.source||'Other');row.by[s]=(row.by[s]||0)+r.amount;row.inc+=r.amount}});return row});
  const total=table.reduce((a,r)=>a+r.inc,0),exp=table.reduce((a,r)=>a+r.exp,0),n=months.length||1;
  return{months,act,srcs,table,total,exp,avg:total/n,net:(total-exp)/n,hasCash:act.some(r=>r.type==='cash'),hasExp:exp>0}}
function renderSummary(){const c=compute();
  $('#kpis').innerHTML=`<div class="kpi"><div class="muted">${t('k_total')}</div><div class="v">${fmt(c.total)}</div></div><div class="kpi hl"><div>${t('k_avg')}</div><div class="v">${fmt(c.avg)}</div></div>`+(c.hasExp?`<div class="kpi"><div class="muted">${t('k_exp')}</div><div class="v">${fmt(c.exp)}</div></div><div class="kpi"><div class="muted">${t('k_net')}</div><div class="v">${fmt(c.net)}</div></div>`:'')+`<div class="kpi"><div class="muted">${t('k_months')}</div><div class="v">${c.months.length}</div></div>`;
  $('#sNote').textContent=t('s_note');
  const lbl=s=>s==='Cash'?t('t_cash'):s;
  $('#sumTable').innerHTML=`<thead><tr><th>${t('s_month')}</th>${c.srcs.map(s=>`<th class="num">${esc(lbl(s))}</th>`).join('')}${c.hasExp?`<th class="num">${t('t_exp')}</th>`:''}<th class="num">${t('s_total')}</th></tr></thead><tbody>`+
   c.table.map(r=>`<tr><td>${monthLabel(r.m)}</td>${c.srcs.map(s=>`<td class="num">${r.by[s]?fmt(r.by[s]):'—'}</td>`).join('')}${c.hasExp?`<td class="num">${r.exp?'−'+fmt(r.exp):'—'}</td>`:''}<td class="num"><b>${fmt(r.inc)}</b></td></tr>`).join('')+`</tbody>`;
  drawChart(c)}
function drawChart(c){const cv=$('#chart');const dpr=window.devicePixelRatio||1;const W=cv.clientWidth||800,H=260;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);const fg=cs.getPropertyValue('--fg').trim()||'#161A2E',mut=cs.getPropertyValue('--muted').trim()||'#5E6375';
