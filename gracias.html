const T={"es": "<h1>¡Gracias! Tu pago se recibió.</h1><p class=\"muted\">Polar te envió el recibo por correo.</p>\n<div class=\"card\"><h2>Qué sigue</h2><ol><li><b>Expediente o renovación:</b> abre la app, arma tu expediente y descárgalo. Si recibiste un código de desbloqueo en el correo de Polar, ingrésalo en el último paso.</li><li><b>Piloto para organizaciones:</b> te escribimos en menos de 24 horas para coordinar la capacitación de 30 minutos.</li><li>¿Algún problema? Escríbenos a {EMAIL}.</li></ol></div>\n<a class=\"btn p\" href=\"/app\">Abrir la app</a><a class=\"btn s\" href=\"/\">Volver al inicio</a>", "en": "<h1>Thank you! Your payment went through.</h1><p class=\"muted\">Polar emailed you the receipt.</p>\n<div class=\"card\"><h2>What's next</h2><ol><li><b>Income file or renewal:</b> open the app, build your file and download it. If your Polar email includes an unlock code, enter it in the last step.</li><li><b>Organization pilot:</b> we'll write within 24 hours to schedule your 30-minute training.</li><li>Any problem? Email {EMAIL}.</li></ol></div>\n<a class=\"btn p\" href=\"/app\">Open the app</a><a class=\"btn s\" href=\"/\">Back home</a>", "pt": "<h1>Obrigado! Seu pagamento foi recebido.</h1><p class=\"muted\">A Polar enviou o recibo para o seu e-mail.</p>\n<div class=\"card\"><h2>Próximos passos</h2><ol><li><b>Dossiê ou renovação:</b> abra o app, monte seu dossiê e baixe. Se o e-mail da Polar trouxer um código de desbloqueio, use-o no último passo.</li><li><b>Piloto para organizações:</b> escrevemos em até 24 horas para marcar o treinamento de 30 minutos.</li><li>Algum problema? Escreva para {EMAIL}.</li></ol></div>\n<a class=\"btn p\" href=\"/app\">Abrir o app</a><a class=\"btn s\" href=\"/\">Voltar ao início</a>", "fr": "<h1>Merci ! Votre paiement a bien été reçu.</h1><p class=\"muted\">Polar vous a envoyé le reçu par e-mail.</p>\n<div class=\"card\"><h2>La suite</h2><ol><li><b>Dossier ou renouvellement :</b> ouvrez l’appli, créez votre dossier et téléchargez-le. Si l’e-mail de Polar contient un code de déblocage, saisissez-le à la dernière étape.</li><li><b>Pilote pour organisations :</b> nous vous écrivons sous 24 heures pour planifier la formation de 30 minutes.</li><li>Un problème ? Écrivez à {EMAIL}.</li></ol></div>\n<a class=\"btn p\" href=\"/app\">Ouvrir l’appli</a><a class=\"btn s\" href=\"/\">Retour à l’accueil</a>"};
